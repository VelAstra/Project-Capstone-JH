<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradients (Deep Emerald Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#032e23"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>

    <!-- Squircle Bezel Stroke Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#047857" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Peeking Sheet Gradient -->
    <linearGradient id="backSheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Document Card Front Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4fbf7"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <!-- Dog-Ear Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- PDF Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Ribbon Master Flow Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Fading Over-Cross Gradient: Fades from 0 to 1 to 0 opacity with perfect color match -->
    <linearGradient id="crossFadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="25%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- Ribbon Specular Highlight -->
    <linearGradient id="ribbonHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadowSquircle" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="shadowDoc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#011812" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="shadowFold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="5" stdDeviation="4" flood-color="#042f22" flood-opacity="0.4"/>
    </filter>

    <filter id="shadowRibbonFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#011812" flood-opacity="0.75"/>
    </filter>

    <filter id="shadowCross" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="6" stdDeviation="5" flood-color="#011812" flood-opacity="0.7"/>
    </filter>

    <filter id="glowSparkle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#shadowSquircle)"/>
  
  <!-- Subtle Ambient Glow -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#ambientGlow)"/>

  <!-- High-Tech Outer Rim Stroke -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle Blueprint Tech Circles -->
  <g opacity="0.05" stroke="#34d399" stroke-width="1.5">
    <circle cx="256" cy="256" r="160" fill="none"/>
    <circle cx="256" cy="256" r="95" fill="none"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
  </g>

  <!-- Secondary Peeking Sheet (Behind) -->
  <g opacity="0.42">
    <rect x="156" y="78" width="224" height="290" rx="22" 
          fill="url(#backSheetGrad)" 
          stroke="#34d399" stroke-width="1.5" stroke-opacity="0.35"
          transform="rotate(5, 268, 223)"/>
  </g>

  <!-- Main Document Sheet -->
  <g filter="url(#shadowDoc)">
    <!-- Document Path with Folded Dog-Ear Corner -->
    <path d="M 160 84 
             L 308 84 
             L 380 156 
             L 380 376 
             A 26 26 0 0 1 354 402 
             L 160 402 
             A 26 26 0 0 1 134 376 
             L 134 110 
             A 26 26 0 0 1 160 84 Z" 
          fill="url(#docGrad)"/>
    
    <!-- Dog-Ear Fold Flap -->
    <g filter="url(#shadowFold)">
      <path d="M 308 84 
               L 308 134 
               A 22 22 0 0 0 330 156 
               L 380 156 Z" 
            fill="url(#foldGrad)"/>
    </g>

    <!-- Document Rim Stroke -->
    <path d="M 160 84 
             L 308 84 
             L 380 156 
             L 380 376 
             A 26 26 0 0 1 354 402 
             L 160 402 
             A 26 26 0 0 1 134 376 
             L 134 110 
             A 26 26 0 0 1 160 84 Z" 
          fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Document Header Details -->
  <!-- PDF Badge Pill -->
  <g>
    <rect x="164" y="120" width="86" height="38" rx="11" fill="url(#badgeGrad)"/>
    <text x="207" y="146" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-size="19" 
          font-weight="800" 
          letter-spacing="1.2" 
          fill="#ffffff" 
          text-anchor="middle">PDF</text>
  </g>

  <!-- Document Preview Text Lines -->
  <g opacity="0.32">
    <rect x="164" y="178" width="182" height="7" rx="3.5" fill="#059669"/>
    <rect x="164" y="195" width="136" height="7" rx="3.5" fill="#10b981"/>
    <rect x="164" y="212" width="160" height="7" rx="3.5" fill="#34d399"/>
  </g>

  <!-- "Omni" 3D Seamless Interwoven Infinity Ribbon -->
  <!-- Base Continuous Lemniscate -->
  <g filter="url(#shadowRibbonFull)">
    <path d="M 256 316 
             C 294 266, 344 246, 384 274 
             C 422 302, 422 334, 384 362 
             C 344 390, 294 366, 256 316 
             C 218 266, 168 246, 128 274 
             C 90 302, 90 334, 128 362 
             C 168 390, 218 366, 256 316 Z" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="34" 
          stroke-linejoin="round"/>
  </g>

  <!-- 3D Over-Strand Weave with Faded Edges and Realistic Drop Shadow -->
  <g filter="url(#shadowCross)">
    <path d="M 200 248 
             C 218 270, 236 292, 256 316 
             C 276 340, 294 362, 312 384" 
          fill="none" 
          stroke="url(#crossFadeGrad)" 
          stroke-width="34" 
          stroke-linecap="butt"/>
  </g>

  <!-- Specular Highlight Along Top Arches -->
  <g opacity="0.8">
    <path d="M 128 274 
             C 168 246, 218 266, 256 316 
             C 294 266, 344 246, 384 274" 
          fill="none" 
          stroke="url(#ribbonHighlight)" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>

  <!-- Luminous Sparkle on Dog-Ear Apex -->
  <g filter="url(#glowSparkle)">
    <path d="M 308 84 Q 308 98 322 98 Q 308 98 308 112 Q 308 98 294 98 Q 308 98 308 84 Z" fill="#a7f3d0"/>
    <circle cx="308" cy="98" r="2" fill="#ffffff"/>
  </g>

  <!-- Precision Star Accent at Right Lobe Curve -->
  <g filter="url(#glowSparkle)">
    <circle cx="384" cy="274" r="4.5" fill="#a7f3d0"/>
    <circle cx="384" cy="274" r="2" fill="#ffffff"/>
  </g>
</svg>