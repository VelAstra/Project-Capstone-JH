<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroMark</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71PT0KILfu" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark mode-split">

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
                    <h1>AeroMark</h1>
                </div>
            </div>

            <div class="sidebar-section">
                <button id="btn-open" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Open File
                </button>
            </div>

            <div class="sidebar-section scrollable">
                <h3>Table of Contents</h3>
                <nav id="toc" class="toc-nav">
                    <!-- Dynamic TOC injected here -->
                </nav>
            </div>

            <div class="sidebar-section stats-panel">
                <div class="stat-item">
                    <span class="stat-label">Words</span>
                    <span id="stat-words" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Read Time</span>
                    <span id="stat-read-time" class="stat-value">0 min</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <select id="theme-selector" class="glass-select">
                    <option value="theme-dark">Dark Mode</option>
                    <option value="theme-light">Light Mode</option>
                    <option value="theme-sepia">Sepia Mode</option>
                    <option value="theme-aurora">Aurora Mode</option>
                </select>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <div id="tabs-container" class="tabs-bar">
                <!-- Tabs will be dynamically inserted here -->
            </div>
            <header class="workspace-header glass-panel">
                <div class="file-info">
                    <span id="current-filename">sample.md</span>
                </div>
                <div class="workspace-controls">
                    <button id="btn-save" class="btn btn-secondary" title="Save to disk">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Save
                    </button>
                    <button id="btn-export-pdf" class="btn btn-secondary" title="Export as PDF / Print">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                        Export PDF
                    </button>
                    <div class="mode-toggle">
                        <button id="btn-mode-split" class="btn-icon active" title="Split View">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                        </button>
                        <button id="btn-mode-reader" class="btn-icon" title="Reader Mode">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        </button>
                    </div>
                </div>
            </header>

            <div class="panels-container">
                <div class="panel editor-panel glass-panel">
                    <textarea id="markdown-editor" spellcheck="false" placeholder="Start typing markdown here..."></textarea>
                </div>
                <div class="panel preview-panel glass-panel" id="preview-container">
                    <div id="markdown-preview" class="markdown-body">
                        <!-- Rendered markdown injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden file input for browser fallback (when not in native wrapper) -->
    <input type="file" id="hidden-file-input" accept=".md, .markdown, .txt" multiple style="display: none;">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+GqIGcUrX9O20xKym2Nig8aY7eSVh2Q8l08jRk7Yt1i1tC" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.4.0/dist/mermaid.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
