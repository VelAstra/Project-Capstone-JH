name: Multiplatform Release (Linux, Windows, macOS, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. BUILD WINDOWS RELEASE
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Windows Installer & Portable
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe

  # 2. BUILD LINUX RELEASE (AppImage)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*.AppImage

  # 3. BUILD MACOS RELEASE (DMG)
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*.dmg

  # 4. BUILD ANDROID APK RELEASE
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || true
          cd ..
          mkdir -p dist-android
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/OmniPDF-Studio-Android.apk
          elif [ -f OmniPDF-Studio-Android.apk ]; then
            cp OmniPDF-Studio-Android.apk dist-android/OmniPDF-Studio-Android.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release
          path: dist-android/*.apk

  # 5. CONSOLIDATE & PUBLISH GITHUB RELEASE
  publish-release:
    needs: [build-windows, build-linux, build-macos, build-android]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-release
          path: all-releases/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-release
          path: all-releases/linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-release
          path: all-releases/macos

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release
          path: all-releases/android

      - name: Publish GitHub Release with Standalone Platform Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'refs/heads/main' && github.ref_name || 'v1.1.0' }}
          name: "OmniPDF Studio v1.1.0 - Annotate Feature + Icon Update"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ""
          files: |
            all-releases/windows/*.exe
            all-releases/linux/*.AppImage
            all-releases/macos/*.dmg
            all-releases/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
