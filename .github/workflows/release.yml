name: Multiplatform Release (Linux, Windows, macOS, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. BUILD WINDOWS RELEASE (Native WebView2 ~3.03 MB)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare Web Distribution
        shell: pwsh
        run: |
          npm install
          node scripts/prepare-dist.js
          Compress-Archive -Path 'dist\*' -DestinationPath 'host\bundle.zip' -Force

      - name: Compile Native WebView2 Binary
        shell: pwsh
        run: |
          dotnet publish host/OmniPdfStudio.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output dist-release
          Rename-Item "dist-release/OmniPdfStudio.exe" "OmniPDF-Studio-Windows-x64.exe"
          Remove-Item "dist-release/*.pdb", "dist-release/*.xml" -Force -ErrorAction SilentlyContinue

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist-release/OmniPDF-Studio-Windows-x64.exe

  # 2. BUILD LINUX RELEASE (Tauri v2 + WebKitGTK ~5-8 MB)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev

      - name: Install Dependencies & Prepare Dist
        run: |
          npm install
          node scripts/prepare-dist.js

      - name: Build Linux Tauri App
        run: npx @tauri-apps/cli build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux Binary
        run: |
          mkdir -p dist-release
          if compgen -G "src-tauri/target/release/bundle/appimage/*.AppImage" > /dev/null; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/OmniPDF-Studio-Linux.AppImage
          elif compgen -G "src-tauri/target/release/bundle/deb/*.deb" > /dev/null; then
            cp src-tauri/target/release/bundle/deb/*.deb dist-release/OmniPDF-Studio-Linux.deb
          elif [ -f "src-tauri/target/release/omnipdf-studio" ]; then
            cp src-tauri/target/release/omnipdf-studio dist-release/OmniPDF-Studio-Linux
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist-release/*

  # 3. BUILD MACOS RELEASE (Tauri v2 + WKWebView ~3-4 MB)
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies & Prepare Dist
        run: |
          npm install
          node scripts/prepare-dist.js

      - name: Build macOS Tauri App
        run: npx @tauri-apps/cli build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS Binary
        run: |
          mkdir -p dist-release
          if compgen -G "src-tauri/target/release/bundle/dmg/*.dmg" > /dev/null; then
            cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/OmniPDF-Studio-macOS.dmg
          elif [ -d "src-tauri/target/release/bundle/macos/OmniPDF-Studio.app" ]; then
            hdiutil create -volname "OmniPDF-Studio" -srcfolder "src-tauri/target/release/bundle/macos/OmniPDF-Studio.app" -ov -format UDZO dist-release/OmniPDF-Studio-macOS.dmg
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist-release/*

  # 4. BUILD ANDROID APK RELEASE (Capacitor + Android WebView ~5 MB)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || true
          cd ..
          mkdir -p dist-android
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/OmniPDF-Studio-Android.apk
          elif [ -f OmniPDF-Studio-Android.apk ]; then
            cp OmniPDF-Studio-Android.apk dist-android/OmniPDF-Studio-Android.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist-android/*.apk

  # 5. CONSOLIDATE & PUBLISH GITHUB RELEASE
  publish-release:
    needs: [build-windows, build-linux, build-macos, build-android]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-release
          path: all-releases/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-release
          path: all-releases/linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-release
          path: all-releases/macos

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release
          path: all-releases/android

      - name: Publish Clean GitHub Release with 4 Binaries and Technical Report
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'refs/heads/main' && github.ref_name || 'v1.2.3' }}
          name: "OmniPDF Studio ${{ github.ref_name != 'refs/heads/main' && github.ref_name || 'v1.2.3' }} - Official Multiplatform Release"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ""
          files: |
            all-releases/windows/*
            all-releases/linux/*
            all-releases/macos/*
            all-releases/android/*
            report/OmniPDF-Studio-Technical-Report.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
