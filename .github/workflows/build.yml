name: AeroMark CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore AeroMark.csproj

    - name: Build Project
      run: dotnet build AeroMark.csproj --configuration Release --no-restore

    - name: Publish Single-File Executable
      run: dotnet publish AeroMark.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AeroMark-Windows-x64
        path: publish/AeroMark.exe
